<script>
const keys=['employees','cables','stock','production','customers','orders'];

const formIds={
 employees:'employeeForm',
 cables:'cableForm',
 stock:'stockForm',
 production:'productionForm',
 customers:'customerForm',
 orders:'orderForm'
};

const listIds={
 employees:'employeeList',
 cables:'cableList',
 stock:'stockList',
 production:'productionList',
 customers:'customerList',
 orders:'orderList'
};

let db={};

function todayDate(){
 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,'0');
 const day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}

function loadData(){
 keys.forEach(k=>{
  try{
   const saved=localStorage.getItem('factory_'+k);
   const parsed=saved?JSON.parse(saved):[];
   db[k]=Array.isArray(parsed)?parsed:[];
  }catch(e){
   db[k]=[];
  }
 });
}

function saveData(k){
 try{
  localStorage.setItem('factory_'+k,JSON.stringify(db[k]));
  updateDashboard();
  return true;
 }catch(e){
  alert('Unable to save data!');
  return false;
 }
}

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function showPage(id,btn){
 document.querySelectorAll('main section').forEach(s=>s.classList.remove('show'));
 document.getElementById(id).classList.add('show');
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 if(btn)btn.classList.add('active');
}

const fields={
 employees:[['name','Name'],['id','ID'],['phone','Mobile'],['role','Role'],['salary','Salary']],
 cables:[['name','Cable Name'],['type','Type'],['size','Size'],['price','Price/Meter']],
 stock:[['name','Material'],['quantity','Quantity'],['unit','Unit'],['minimum','Minimum']],
 production:[['name','Cable'],['quantity','Meters'],['date','Date'],['shift','Shift']],
 customers:[['name','Customer'],['phone','Mobile'],['address','Address']],
 orders:[['customer','Customer'],['cable','Cable'],['quantity','Meters'],['amount','Amount'],['status','Status']]
};

function render(k){
 const target=document.getElementById(listIds[k]);
 if(!target)return;

 if(!db[k].length){
  target.innerHTML='<p class="small">No records added yet.</p>';
  return;
 }

 let html='<div class="table-wrap"><table><thead><tr>';

 fields[k].forEach(f=>html+='<th>'+f[1]+'</th>');
 html+='<th>Action</th></tr></thead><tbody>';

 db[k].forEach((item,i)=>{
  html+='<tr>';
  fields[k].forEach(f=>html+='<td>'+esc(item[f[0]])+'</td>');
  html+='<td><button type="button" class="delete" onclick="removeItem(\''+k+'\','+i+')">Delete</button></td></tr>';
 });

 target.innerHTML=html+'</tbody></table></div>';
}

function removeItem(k,i){
 if(confirm('Delete this record?')){
  db[k].splice(i,1);
  if(saveData(k))render(k);
 }
}

function updateDashboard(){
 keys.forEach(k=>{
  const id='count'+k[0].toUpperCase()+k.slice(1);
  const element=document.getElementById(id);
  if(element)element.textContent=db[k].length;
 });
}

// Set maximum production date to today
const productionDate=document.querySelector('#productionForm input[name="date"]');
productionDate.max=todayDate();

// Form submission and validations
keys.forEach(k=>{
 const form=document.getElementById(formIds[k]);

 if(!form){
  console.error('Form not found:',formIds[k]);
  return;
 }

 form.addEventListener('submit',e=>{
  e.preventDefault();

  const item=Object.fromEntries(new FormData(form).entries());

  // 1. Production date validation
  if(k==='production'){
   if(item.date>todayDate()){
    alert('ERROR: Future date is not allowed!');
    return;
   }
  }

  // 2. Duplicate customer mobile validation
  if(k==='customers'){
   const mobile=(item.phone||'').replace(/\D/g,'');

   if(mobile){
    const duplicate=db.customers.some(customer=>
     (customer.phone||'').replace(/\D/g,'')===mobile
    );

    if(duplicate){
     alert('ERROR: Mobile number already exists!');
     return;
    }
   }
  }

  // 3. Minimum stock validation
  if(k==='stock'){
   if(Number(item.quantity)<20){
    alert('ERROR: Minimum stock quantity must be 20!');
    return;
   }
  }

  // Save valid record
  db[k].push(item);

  if(!saveData(k)){
   db[k].pop();
   return;
  }

  render(k);
  form.reset();

  alert('Record added successfully!');
 });
});

// Load and display existing records
loadData();
keys.forEach(render);
updateDashboard();
           </script>
